schema: orrlens/question/1
id: releases_manual_changes
pillar: release_quality
order: 10
title: Changes only through reviewed pipelines and IaC, including emergencies
max_risk: HIGH
priority: P0
core_path: true
category: Deployment safety
lineage: [releases_manual_changes, releases_change_management]
choice_prefix: cc_
description:
  question: >-
    Is every production change, including infrastructure, configuration, feature flags and changes proposed by
    scripts, bots or AI agents, reviewed by someone other than its author and applied only through pipelines, even
    during emergencies?
  evidence_to_collect: >-
    the list of production change paths (IaC, application configuration, feature flags, pipelines, database
    changes). Repository protection rules and pipeline permissions. Which people and roles can change production
    outside the pipeline, and the guardrails that stop them. Drift detection results and alarms. The emergency
    change procedure and the audit record of its last use.
helpful:
  display_text: REL08-BP05 Deploy changes with automation (AWS Well-Architected)
  url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_tracking_change_management_automated_changemgmt.html
statements:
  - id: cc_pipeline_only
    tier: core
    title: Infrastructure, configuration, feature-flag and pipeline changes are version-controlled and deployed only by pipelines
    concept: pipeline-only-production-changes
    severity_basis: "wa:SEC11-BP06 (High)"
    wa_bp: SEC11-BP06
    good: >-
      Application code, IaC, application and feature-flag configuration, database schema changes and the pipeline
      definitions themselves live in version control, and every planned production change is applied by the
      pipeline from a reviewed commit. A change made outside the pipeline raises an alarm. Human write access
      (read-only defaults or time-bound elevation) is scored in event_mutating_access. The practice may be in-house
      or provided by your operations partner under contract, with evidence you can inspect.
    platform_notes: >-
      EC2: build images in a pipeline and replace instances instead of changing them by hand. Containers: deploy
      image digests through the pipeline. Serverless: deploy functions, layers and APIs with IaC. Flags: a configuration
      service with a deployment strategy.
    partition_notes: >-
      In AWS GovCloud (US), CodePipeline cross-Region actions are not available and third-party source connections
      work only in AWS GovCloud (US-East), as of 2026-10-05; verify per Region.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_appsec_deploy_software_programmatically.html
    improvement: >-
      Inventory every way production changes today (console, CLI, scripts, configuration tools, feature-flag
      dashboards, database clients). Move each into version control with a pipeline deployment, restrict human
      write access as event_mutating_access describes, and alarm when a change is made outside the pipeline.
    improvement_url: https://builder.aws.com/content/3ErTKQOTKc5NIw031UePBPxTQ6I/automating-safe-hands-off-deployments
    additional_improvement:
      - display_text: Service control policies (SCPs) in AWS Organizations
        url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
      - display_text: What is AWS AppConfig? (deploy configuration and feature flags safely)
        url: https://docs.aws.amazon.com/appconfig/latest/userguide/what-is-appconfig.html
  - id: cc_review_enforced
    tier: core
    title: Every change, including from scripts, bots or AI agents, is reviewed by someone other than its author, enforced technically
    concept: enforced-independent-change-review
    severity_basis: >-
      wp-orr:all code changes (software, configuration, infrastructure, canary and ops tools) are reviewed and
      approved by someone other than the code author (ORR whitepaper Appendix B example question)
    wa_bp: SEC11-BP04
    good: >-
      Repository protection rules or an equivalent control require approval by at least one person other than the
      author before any change that reaches production can merge or deploy: application code, IaC, configuration,
      feature flags, canaries, operations tools and pipeline definitions. Changes proposed by scripts, bots or AI
      agents are reviewed by an accountable human, and no bot or agent can approve its own change or bypass review.
      Administrators cannot skip the rule without an audited exception. For automation that acts on its own at run
      time (scaling, automated remediation, scheduled jobs), the automation's code and configuration are reviewed;
      individual runs within those reviewed bounds are not separate changes. The AWS ORR whitepaper's example questions
      score the absence of this review as High risk.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/operational-readiness-reviews/appendix-b-example-orr-questions.html
    improvement: >-
      Turn on protection rules for every repository that feeds production (required review by someone other than
      the author, no direct pushes, no self-approval, required status checks), apply them to bot and AI agent
      identities too, restrict who can change the rules or the pipeline's checks, and make the pipeline deploy only
      reviewed commits from protected branches. Audit regularly for bypasses.
    improvement_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_appsec_regularly_assess_security_properties_of_pipelines.html
    additional_improvement:
      - display_text: AWS CodePipeline manual approval actions (limit who can approve)
        url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals.html
  - id: cc_preview_drift
    tier: sec
    title: IaC changes are previewed before apply, and drift is detected and alarmed
    concept: iac-preview-and-drift-detection
    wa_bp: OPS05-BP03
    good: >-
      Every IaC change shows a reviewed preview of what will be created, changed, replaced or deleted before it is
      applied (for example CloudFormation change sets or a Terraform plan), and replacing or deleting a stateful
      resource needs explicit approval. The deletion and replacement guards themselves (for example a Retain
      deletion policy, stack policies and termination protection) are scored in event_operator_tooling_safety.
      Drift between deployed resources and their templates is checked on a schedule and alarms the owner, and drift
      is fixed through the pipeline.
    helpful_url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html
    improvement: >-
      Make the pipeline produce and publish an IaC preview for review, fail or require approval when a change
      replaces or deletes a stateful resource, and schedule drift detection (for example the AWS Config managed
      rule cloudformation-stack-drift-detection-check) with an alarm to the owner. Fix drift by changing code, not
      by hand.
    improvement_url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html
    additional_improvement:
      - display_text: AWS Config managed rule cloudformation-stack-drift-detection-check
        url: https://docs.aws.amazon.com/config/latest/developerguide/cloudformation-stack-drift-detection-check.html
  - id: cc_emergency_path
    tier: sec
    title: A documented emergency path still uses the pipeline and review, may override windows and bake time, and is audited
    concept: emergency-change-path
    wa_bp: REL08-BP05
    good: >-
      For urgent fixes, a documented emergency path ships through the same pipeline: a reviewer is still required
      (any available engineer, at any hour), and only time-based controls such as deployment windows, bake time or
      the number of waves may be shortened, by a named approver. Direct production access is kept for cases the
      pipeline cannot handle, through an audited break-glass role that alarms on use. Every emergency change is
      recorded, reviewed afterwards and reconciled with code, and the path was used or rehearsed in the last 12 months.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/devops-guidance/ag.sad.5-implement-break-glass-procedures.html
    improvement: >-
      Write the emergency change procedure: who can invoke it, which pipeline controls may be shortened and which
      never are (review, safety tests, rollback), and how break-glass access is granted, alarmed and revoked. Add a
      pipeline option that skips only time-based gates with a recorded approver, rehearse the path in a game day,
      and review every use within a few days.
    improvement_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/sec_permissions_emergency_process.html

schema: orrlens/question/1
id: event_oncall_rotation
pillar: event_management
order: 60
title: On-call paging, runbooks and escalation
max_risk: HIGH
priority: P0
core_path: true
category: Escalation
lineage: [event_oncall_rotation, event_alarms]
choice_prefix: oc_
description:
  question: >-
    When a critical alarm fires, is a trained person paged at every hour the workload must be available, do they
    have a runbook for that alarm, and does the page escalate if nobody responds?
  evidence_to_collect: >-
    the on-call schedule and its coverage hours. Page acknowledgment times for the last quarter. The
    alarm-to-runbook mapping. The date each runbook was last exercised. Escalation policies and contact paths.
helpful:
  display_text: OPS07-BP01 Ensure personnel capability (AWS Well-Architected)
  url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_ready_to_support_personnel_capability.html
statements:
  - id: oc_paged
    tier: core
    title: Critical alarms page a trained on-call rotation, in-house or contracted, for all hours the workload must be available
    concept: oncall-paging-rotation
    severity_basis: "wa:OPS07-BP01 (High)"
    wa_bp: OPS07-BP01
    good: >-
      Every paging alarm notifies a named rotation through a paging tool that confirms delivery and
      acknowledgment, during every hour the workload's documented availability requires (not 24x7 by default).
      On-call engineers are trained on the workload and have the access they need before their shift starts. Time
      to acknowledge has a target (for example 5 to 15 minutes for critical pages) and is tracked. The rotation
      may be in-house or provided by an operations partner under contract, with evidence you can inspect.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_ready_to_support_personnel_capability.html
    improvement: >-
      Define the hours the workload must be supported, staff a rotation with enough trained people to cover them
      sustainably, connect paging alarms to a paging tool (for example through Amazon SNS to a partner paging
      service), set and track an acknowledgment target, and send a test page whenever the rotation changes.
    improvement_url: https://docs.aws.amazon.com/sns/latest/dg/welcome.html
  - id: oc_runbook_per_alarm
    tier: core
    title: Every paging alarm links to a runbook from the alarm or the ticket
    concept: runbook-per-alarm
    severity_basis: "wa:OPS10-BP02 (High)"
    wa_bp: OPS10-BP02
    good: >-
      Each paging alarm's description, or the ticket it creates, links to a runbook for that alarm: what the
      alarm means, how to check customer impact, the first mitigation steps (for example roll back, shift
      traffic or add capacity), the permissions needed, and when to escalate. An alarm without a runbook does not
      page, and new paging alarms are reviewed for a runbook before they go live.
    reader_note: >-
      This page refers to AWS Systems Manager Incident Manager, which is closed to new customers; any
      incident-management or paging tool, or a runbook link in the alarm description, meets this practice.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_event_response_process_per_alert.html
    improvement: >-
      Inventory paging alarms, write a short runbook for each one (starting with the most frequent), put the
      runbook link in the alarm description, and add a check to alarm code review or CI that fails when a paging
      alarm has no runbook link. Automate stable runbook steps where it is safe.
    improvement_url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-automation.html
  - id: oc_runbooks_exercised
    tier: sec
    title: Runbooks, including the permissions they need, were exercised in the last 12 months or after major changes
    concept: runbooks-exercised
    wa_bp: OPS07-BP03
    good: >-
      Each runbook was run end to end in the last 12 months, or since the last major change, by someone other
      than its author, in a game day, a pre-production drill or a real event, using the same roles and
      permissions on-call engineers have. Steps that failed, were unclear or needed missing access were fixed,
      and the runbook records the date it was last exercised.
    reader_note: >-
      This page links to an example that uses AWS CloudTrail Lake, which is closed to new customers; any runbook
      format or tool meets this practice.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_ready_to_support_use_runbooks.html
    improvement: >-
      Add a last-exercised date to each runbook, schedule drills for runbooks older than 12 months or affected by
      major changes, run them with on-call roles and permissions, and fix what failed. Combine drills with your
      game days where possible.
    improvement_url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_testing_resiliency_game_days_resiliency.html
  - id: oc_escalation
    tier: sec
    title: >-
      Unacknowledged pages escalate automatically, and incident-lead, management, security and dependency-owner
      paths are documented
    concept: page-escalation-paths
    wa_bp: OPS10-BP04
    good: >-
      The paging tool escalates a page that is not acknowledged within the target to a secondary responder and
      then to a manager. Documented paths say when and how to engage an incident lead, management, the security
      team and internal dependency owners, with contacts kept current. Escalation to AWS and other providers is
      scored in event_provider_escalation, and reaching contacts when normal tools are down is scored in
      event_emergency_access.
    reader_note: >-
      This page refers to AWS Systems Manager Incident Manager, which is closed to new customers; any paging or
      incident-management tool with escalation policies meets this practice.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_event_response_define_escalation_paths.html
    improvement: >-
      Configure an escalation policy in your paging tool (primary, secondary, manager), test it by leaving a test
      page unacknowledged, and document escalation paths and contacts for incident command, management, security
      and internal dependency owners. Review the contacts at each rotation change.
    improvement_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_event_response_define_escalation_paths.html

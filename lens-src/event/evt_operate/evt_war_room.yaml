schema: orrlens/question/1
id: evt_war_room
pillar: evt_operate
order: 10
title: Staffing, war room and escalation for the event window
max_risk: HIGH
priority: P0
core_path: false
category: Escalation
lineage: []
choice_prefix: wr_
description:
  question: >-
    Is the event window staffed with people who can act, and can they reach every team, partner and provider they
    depend on quickly, through more than one channel?
  evidence_to_collect: >-
    the shift plan and roster for the event window. The escalation tree for each component and the date each entry was
    last tested. The shared channel and its fallback agreed with partners and, where your support plan provides it, AWS.
helpful:
  display_text: OPS10-BP04 Define escalation paths (AWS Well-Architected)
  url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_event_response_define_escalation_paths.html
statements:
  - id: wr_staffing
    tier: core
    title: A staffed shift plan or war room covers the window, including dependency owners, with shifts and handoffs that limit fatigue
    concept: event-window-staffing
    severity_basis: >-
      deviation:A fixed event window concentrates risk into hours that cannot be re-run, so an unstaffed shift or a
      missing dependency owner turns a recoverable fault into a failed event.
    wa_bp: OPS03-BP07
    good: >-
      A roster covers the whole event window and the hours just before and after it, with an incident lead, operators
      for each critical component, owners or contacts for critical dependencies (for example identity, network,
      database, payment and partners) and a communications lead, in-house or contracted. Shifts have a maximum length,
      handoffs are written, backups are named, and everyone tested their access, dashboards and runbooks before the
      window. This adds the event's extra staffing to the core question 'On-call paging, runbooks and escalation'.
    partition_notes: >-
      AWS Countdown Premium is offered for workloads in the AWS GovCloud (US) Regions as of 2026-10-06.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_org_culture_team_res_appro.html
    improvement: >-
      Build the event roster from the forecast and the risk list: name the incident lead, component operators,
      dependency contacts and communications lead for each shift, cap shift length, write a handoff checklist, and have
      everyone test their access to accounts, dashboards and runbooks a week before. Optional help such as AWS
      Countdown Premium (a paid add-on for Business Support+ and Enterprise Support, with one recurring subscription
      included in Unified Operations) can add AWS engineers to the plan; sign up 2-3 weeks before the event. Enterprise
      Support also includes AWS Countdown event management.
    improvement_url: https://aws.amazon.com/premiumsupport/aws-countdown/
  - id: wr_escalation_tree
    tier: core
    title: An escalation tree per component, including AWS, partners and vendors, was verified within two weeks of the event
    concept: event-escalation-tree-verified
    severity_basis: >-
      deviation:OPS10-BP04 is rated Medium; the lens rates an unverified event escalation tree High because contacts go
      stale between events and the event window leaves no time to find the right person.
    wa_bp: OPS10-BP04
    good: >-
      For each critical component and dependency the tree lists primary and backup contacts, how to reach them out of
      hours and the expected response time, including AWS (the support path and case severity to use), partners,
      vendors, network providers and internal teams. Within two weeks of the event every entry was tested, for example
      with a test page or call, and the shift knows the fallbacks if the AWS Support Center console or API is impaired.
      It extends the escalation paths in the core questions 'On-call paging, runbooks and escalation' and 'Escalation
      to AWS and other providers, and provider-initiated change' to the event's extra parties.
    reader_note: >-
      This page refers to AWS Systems Manager Incident Manager, which is closed to new customers; any paging, on-call
      or escalation tool meets this practice.
    helpful_url: https://docs.aws.amazon.com/wellarchitected/latest/framework/ops_event_response_define_escalation_paths.html
    improvement: >-
      Extend the core escalation paths into an event tree: list each component and dependency, primary and backup
      contacts and channels, and the AWS support path and severity to use. Two weeks before the event, test every
      contact, fix stale entries, and give the event shift an access-controlled offline copy (for example an encrypted
      file, or a printed copy held by the incident lead) that is destroyed or refreshed after the event.
    improvement_url: https://docs.aws.amazon.com/awssupport/latest/user/aws-support-plans.html
    additional_improvement:
      - display_text: Case management (AWS Support)
        url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
  - id: wr_shared_channel
    tier: sec
    title: A pre-agreed secure shared channel with AWS and partners exists, plus a fallback
    concept: event-shared-channel
    wa_bp: OPS10-BP04
    good: >-
      Before the event, the event shift and key partners agreed on an access-controlled channel for the window, such as
      a conference bridge or a chat channel, with who joins and when. The AWS leg is whatever your support plan or
      engagement provides: an account team or AWS Countdown Premium engagement where you have one, or otherwise the
      AWS Support case path with the chat or phone contact options of your plan and the case severity to use, written
      into the escalation tree. A fallback channel does not depend on the workload, its identity
      provider or its primary Region. Sensitive and export-controlled data stay out of shared channels.
    helpful_url: https://aws.amazon.com/premiumsupport/aws-countdown/
    improvement: >-
      Agree the channel and its fallback with each partner, and with AWS where your support plan or engagement provides
      for it, at least two weeks before the event. Test that every party can join, document who opens it and when,
      keep the joining details in the access-controlled offline copy of the escalation tree, and rotate bridge PINs or
      links after the event.
    improvement_url: https://docs.aws.amazon.com/awssupport/latest/user/case-management.html
pes_lesson:
  statement: wr_shared_channel
  month: Oct 2025
  url: https://aws.amazon.com/message/101925/
  lesson: >-
    for almost three hours customers could not create, view or update support cases through the AWS Support Console
    and API, so agree escalation channels with AWS and partners that do not depend on a single console.

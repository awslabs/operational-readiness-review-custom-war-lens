# Credential-free CI: offline checks, links added by the change, unit tests, and workflow static analysis.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lens checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r tools/orrlens/requirements-ci.txt

      - name: Offline checks
        run: python3 -m tools.orrlens check --offline --verbose

      - name: Unit tests
        run: python3 -m unittest discover -s tools/orrlens/tests -v

      - name: Links added by this pull request
        if: github.event_name == 'pull_request'
        run: python3 -m tools.orrlens links --changed-only origin/main

  workflows:
    name: Workflow static analysis (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r tools/orrlens/requirements-zizmor.txt

      - name: Run zizmor
        run: zizmor --offline --format plain .github/workflows .github/dependabot.yml

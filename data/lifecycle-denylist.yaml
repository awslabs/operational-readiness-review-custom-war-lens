    effective: 2026-03-31
    alternative: ARC Region switch for multi-Region readiness and recovery orchestration
    source: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-readiness-availability-change.html
    notes: The availability-change page gives no date; effective is the announcement date on the Services in Maintenance page. ARC zonal shift, zonal autoshift, routing control and Region switch are unaffected.
  - name: AWS CloudTrail Lake

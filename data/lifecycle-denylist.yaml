  - name: Amazon Application Recovery Controller (ARC) readiness check
    patterns: ['\barc readiness', 'application recovery controller( \(arc\))?( -)? readiness', 'route ?53 (arc )?readiness check', 'route53-recovery-readiness', 'recovery readiness']
    url_patterns: ['docs\.aws\.amazon\.com/r53recovery/latest/dg/(recovery-readiness|arc-readiness|readiness)']

    url_patterns: ['docs\.aws\.amazon\.com/awscloudtrail/latest/userguide/(cloudtrail-lake|query-|lake-)']
    status: closed to new customers
    effective: 2026-05-31
    alternative: CloudTrail trails delivered to Amazon S3 and Amazon CloudWatch Logs, queried with CloudWatch Logs Insights or Amazon Athena
    source: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html
    notes: Both pages read live on 2026-10-06. The availability-change page says CloudTrail Lake "will no longer be
      open to new customers starting on May 31, 2026", so effective is 2026-05-31. The Services in Maintenance page
      lists "AWS CloudTrail - Lake" with an announcement date of March 31, 2026; that is the announcement, not the
      closing date. AWS CloudTrail trails, CloudTrail Insights and aggregated events are unaffected.
  - name: Amazon Bedrock Agents Classic
    patterns: ['bedrock agents?\b(?! ?core)', 'agents for amazon bedrock', 'bedrock agents classic', 'amazon\.userinput', '\binline agents?\b', 'invokeinlineagent']
    url_patterns: ['docs\.aws\.amazon\.com/bedrock/latest/userguide/agents(?:[-.]|$)']
    status: closed to new customers
    effective: 2026-07-30
    alternative: Amazon Bedrock AgentCore
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-classic-maintenance-mode.html
    notes: The pattern does not match "Amazon Bedrock AgentCore". Inline agents (InvokeInlineAgent) and the built-in AMAZON.UserInput tool are Agents Classic features (maintenance-mode page, checked 2026-10-07); the AgentCore harness "inline function tools" are not matched.

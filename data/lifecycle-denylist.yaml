# Services and features that ORR lens text must never recommend (see CONTRIBUTING.md, "Content rules").
# A curated subset of the AWS General Reference "Services in Maintenance" and "Services in Sunset" pages, read
# live on 2026-10-06 (re-read on 2026-10-07 for the generative AI entries), plus each service's own
# availability-change or end-of-support page: it carries the items a
# readiness review might otherwise recommend, not every item on those pages. Check both pages before naming a
# service in lens text. Refresh at each release and quarterly review.
#
# patterns: case-insensitive regular expressions (Python re syntax) that detect a mention of the item.
# url_patterns: case-insensitive regular expressions matched against every link in lens text (helpful, improvement
#   and additional-resource URLs). A link to the item's own documentation fails unless the statement carries a
#   reader note (the reader_note field, or a trailing "Reader note:" in the improvement text). Every entry needs one.
#   They are deliberately specific so they do not match allowed services or ordinary words, for example
#   "X-Ray SDK" but not "AWS X-Ray", "ARC readiness check" but not "operational readiness", and
#   "Amazon Pinpoint" but not the verb "pinpoint". Text marked as a reader note is exempt.
# status: maintenance | closed to new customers | end of support | discontinued | preview
#   ("maintenance" on the Services in Maintenance page means closed to new customers and no new features;
#   "preview" marks a feature whose documentation says it is in preview: lens bars never depend on previews).
# effective: the date the status took or takes effect, from the source page. Where the source page gives no
#   date, the announcement date from the Services in Maintenance page is used and the notes say so.
schema: orrlens/lifecycle-denylist/1
as_of: 2026-10-07
source: https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html
sources:
- https://docs.aws.amazon.com/general/latest/gr/maintenance_services.html
- https://docs.aws.amazon.com/general/latest/gr/sunset_services.html
entries:
  - name: AWS X-Ray SDKs and daemon
    patterns: ['x[- ]?ray sdks?\b', 'x[- ]?ray daemon', 'aws-xray-sdk', 'xray-daemon', 'x[- ]?ray (go|java|node\.?js|python|\.net|ruby) sdk', 'x[- ]?ray sdk for']
    url_patterns: ['docs\.aws\.amazon\.com/xray/latest/devguide/xray-(sdk|daemon)', 'docs\.aws\.amazon\.com/xray-sdk-', 'github\.com/aws/aws-xray-(sdk|daemon)']
    status: maintenance
    effective: 2026-02-25
    alternative: OpenTelemetry instrumentation (for example AWS Distro for OpenTelemetry or the CloudWatch agent) sending traces to AWS X-Ray or the CloudWatch OTLP endpoint
    source: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-daemon-timeline.html
    notes: AWS X-Ray itself remains available and is not denylisted; only the X-Ray SDKs and daemon are in maintenance mode.
  - name: AWS Systems Manager Incident Manager
    patterns: ['incident manager', 'ssm contacts', 'ssm-incidents', 'ssm-contacts']
    url_patterns: ['docs\.aws\.amazon\.com/incident-manager/']
    status: closed to new customers
    effective: 2025-11-07
    alternative: Any incident-management, paging or notification tool, for example Amazon SNS, AWS End User Messaging or a partner tool
    source: https://docs.aws.amazon.com/incident-manager/latest/userguide/incident-manager-availability-change.html
    notes: Also not available in AWS GovCloud (US). Lens text should call the role "incident lead" or "incident commander", not "incident manager", so the pattern does not need an exception.
  - name: AWS Systems Manager Change Manager
    patterns: ['\bchange manager\b']
    url_patterns: ['docs\.aws\.amazon\.com/systems-manager/latest/userguide/change-manager']
    status: closed to new customers
    effective: 2025-11-07
    alternative: Change review enforced in the pipeline and IaC workflow, or an AWS Partner ITSM solution
    source: https://docs.aws.amazon.com/systems-manager/latest/userguide/change-manager-availability-change.html
  - name: AWS Systems Manager Application Manager
    patterns: ['\bapplication manager\b']
    url_patterns: ['docs\.aws\.amazon\.com/systems-manager/latest/userguide/application-manager']

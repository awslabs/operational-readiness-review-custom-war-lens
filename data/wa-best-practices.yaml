# Well-Architected Framework best practices that ORR lens text may cite.
# Each entry records the live page title and the level of risk exactly as the page states it
# ("Level of risk exposed if this best practice is not established"), checked on the date shown.
# url is the pillar-guide form; alt_urls lists the Framework form, which serves the same page.
# Both forms returned HTTP 200 with no redirect on 2026-10-06.
# A severity_basis of "wa:<BP-ID> (High)" is valid only for entries whose level_of_risk is High.
# Entries with a lens field are best practices of the AWS Well-Architected Generative AI, Agentic AI and
# Responsible AI lenses (lens: generative-ai | agentic-ai | responsible-ai; see config.WA_BP_SOURCES). Entries
# without one are Framework practices. Each AI lens entry records the live page title, URL and level of risk,
# checked on 2026-10-07; the lens version is the publication date on the lens's Document revisions page.
# Regenerate from the live pages at each release and at each quarterly review.


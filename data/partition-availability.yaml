    Regions; the Shield CreateProtection API and AWS::Shield::Protection resource are not offered there; the GovCloud
    Firewall Manager page states that Firewall Manager does not support Shield Advanced. Commercial Regions: application-layer
    automatic mitigation moves to the Anti-DDoS managed rule group (auto-upgrade of eligible web ACLs from 2026-10-25).'

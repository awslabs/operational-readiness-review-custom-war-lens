# Partition availability for every AWS service, feature, program and policy named in lens text
# (see CONTRIBUTING.md, "Content rules", and docs/govcloud.md). Values are only "available", "not available" or
# "n/a"; future availability is never recorded. "n/a" means the item has no partition-specific availability
# (for example open-source tools, public programs, or the partition itself).
# Sources: the AWS GovCloud (US) User Guide service pages, and AWS Capabilities by Region
# (https://builder.aws.com/build/capabilities, also used through its public catalog of features, APIs and
# CloudFormation resources). Lens text must still say "verify per Region" and date each statement.
# aws: availability in the commercial partition to new customers. aws-us-gov: availability in AWS GovCloud (US).
# not_services: AWS or Amazon names that lens text uses but that are not services, features, programs or
# policies (whitepaper titles, GitHub sample names, certificate authority names, phrase fragments).
schema: orrlens/partition-availability/1
as_of: 2026-10-06
not_services:
- AWS Fault Isolation Boundaries
- AWS Best Practices for DDoS Resiliency
- AWS Break Glass Role
- AWS DDoS
- AWS DDoS Test Partner
- Amazon Trust Services
entries:

  - AWS GovCloud (US-West)
  - AWS GovCloud (US-East)
  - aws-us-gov
  kind: non-service
  aws: available
  aws-us-gov: n/a
  source: https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/whatis.html
  notes: The partition itself, listed so CI recognizes the name. aws records that GovCloud accounts are obtained
    through a standard AWS account; aws-us-gov is n/a.

  notes: Tests must be run by an approved AWS DDoS Test Partner against a resource protected by AWS Shield Advanced
    (or an edge-optimized API Gateway endpoint in a Shield Advanced account). Neither Shield Advanced nor edge-optimized
    APIs are available in AWS GovCloud (US), so GovCloud-only workloads cannot run one; rehearse DDoS response as
    a tabletop.

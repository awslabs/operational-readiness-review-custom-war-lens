# Pinned allowlist of Amazon Builders' Library articles (see CONTRIBUTING.md, "Content rules").
# legacy_url: the aws.amazon.com/builders-library/<slug>/ URL.
# location:   the 301 Location header returned for legacy_url (curl -sI, no -L), or "no-redirect"
#             when legacy_url itself serves the article with HTTP 200.
# article_id: the builder.aws.com content ID taken from location (null for no-redirect).
# title:      the article title. On builder.aws.com a valid response carries
#             "<title> | AWS Builder Center"; the generic "AWS Builder Center" shell means unverified,
#             not broken. Never use body size as a signal.
# url:        the URL lens text should link (location, or legacy_url for no-redirect).
# All entries were captured and their titles verified on 2026-10-06 (up to 5 attempts each).
schema: orrlens/builder-allowlist/1
# pages: builder.aws.com pages that are not Builders' Library articles (no /content/<id>/ path), with the
# exact live title, so a link checker can verify them by title instead of by article id.
pages:
  - url: https://builder.aws.com/build/capabilities
    title: Capabilities | Build | AWS Builder Center
    checked: 2026-10-06
    notes: AWS Capabilities by Region. Served as an application shell; the title is stable.
checked: 2026-10-06
